# Replaces the local ~/.aws mount — pod gets AWS access via this IAM role (IRSA), not a credentials file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: investor-intelligence-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::022444447221:role/investor-intelligence-irsa-role"
